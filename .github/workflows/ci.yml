# CI: build, testes unitários e cobertura (Coverlet → Cobertura XML) para a Fase 3 / POSTECH.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # App em net7.0 + testes em net10.0 — instalar os dois SDKs evita falhas de targeting.
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            7.0.x
            10.0.x

      - name: Restore
        run: dotnet restore Localidades.sln

      - name: Build
        run: dotnet build Localidades.sln --no-restore --configuration Release

      - name: Test with coverage
        run: |
          dotnet test Localidades.sln \
            --no-build \
            --configuration Release \
            --verbosity normal \
            --collect:"XPlat Code Coverage" \
            --results-directory "${{ github.workspace }}/TestResults"

      - name: List coverage files (log)
        if: always()
        run: find "${{ github.workspace }}/TestResults" -name '*.cobertura.xml' -print

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: code-coverage
          path: TestResults/**/*
          if-no-files-found: warn
